<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bassline 贝斯练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.5/full/pyodide.js"></script>
<style>
  /* ---------- 颜色和字体 ---------- */
  :root {
    --bg: #0d2e23;          /* forest：品牌主色 */
    --bg-deep: #082019;
    --green-mid: #186b54;
    --lime: #c5f54a;        /* 强调：选中、数字 */
    --lilac: #dadaff;       /* hero、标签 */
    --lilac-deep: #b8b4f0;
    --cream: #f3efe5;       /* 页面底色 */
    --cream-soft: #e8e2d2;
    --white: #ffffff;
    --text: #0d2e23;
    --text-soft: #4d6158;
    --line: #e2ddd0;

    --display: "Bricolage Grotesque", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --body: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --radius: 24px;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.02em; }
  em { font-style: italic; color: var(--green-mid); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  /* 带短横线的小标题 */
  .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--green-mid); margin-bottom: 10px; }
  .eyebrow::before { content: ""; width: 24px; height: 1.5px; background: currentColor; }

  /* ---------- 导航 ---------- */
  nav { background: var(--bg); color: var(--cream); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.03em; }
  .logo span { color: var(--lime); }
  .nav-tag { font-size: 13px; padding: 6px 14px; border-radius: 100px; border: 1px solid rgba(243, 239, 229, 0.3); color: rgba(243, 239, 229, 0.8); }

  /* ---------- Hero ---------- */
  .hero { margin: 20px 0; background: var(--lilac); border-radius: 32px; padding: 36px 48px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: center; overflow: hidden; }
  .hero h1 { font-size: clamp(36px, 5vw, 60px); line-height: 1.05; font-weight: 700; }
  .hero p { color: var(--text-soft); font-size: 17px; max-width: 460px; margin: 16px 0 0; }
  .hero svg { width: 100%; height: auto; max-height: 200px; }

  /* ---------- 主体：左边输入，右边乐谱 ---------- */
  .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; margin-bottom: 20px; }
  .layout > * { min-width: 0; }
  .card { background: var(--white); border-radius: var(--radius); padding: 28px; }
  .step + .step { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); }
  .step h3 { font-size: 18px; margin-bottom: 12px; }
  .hint { font-size: 13px; color: var(--text-soft); margin: -6px 0 12px; }

  /* 药丸按钮：练习方式 */
  .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pill { font: 600 14px var(--body); padding: 10px 16px; border-radius: 100px; border: 1.5px solid var(--bg); background: transparent; color: var(--bg); cursor: pointer; transition: background 0.15s, color 0.15s; }
  .pill:hover { background: var(--cream); }
  .pill.on, .pill.primary { background: var(--bg); color: var(--lime); }
  .pill:focus-visible, .chip:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

  /* 小圆片：根音、和弦类型 */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 500 14px var(--body); min-width: 42px; padding: 7px 12px; border-radius: 100px; border: none; background: var(--cream); color: var(--text); cursor: pointer; transition: background 0.15s; }
  .chip:hover { background: var(--cream-soft); }
  .chip.on { background: var(--lime); font-weight: 700; }
  .chip.root { font-family: var(--display); font-weight: 600; }
  .chips + .chips { margin-top: 10px; }

  /* 和弦进行 */
  .progression-box { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; background: var(--lilac); border-radius: 18px; padding: 12px; margin-bottom: 14px; }
  .progression { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .progression .arrow { color: var(--text-soft); font-size: 13px; }
  .progression .empty { color: var(--text-soft); font-size: 13px; padding: 6px 4px; }
  .slot { display: inline-flex; align-items: center; gap: 6px; font: 700 15px var(--display); padding: 5px 5px 5px 14px; border-radius: 100px; background: var(--bg); color: var(--lime); }
  .slot .x { width: 22px; height: 22px; border: none; border-radius: 50%; background: rgba(197, 245, 74, 0.18); color: var(--lime); font-size: 14px; line-height: 1; cursor: pointer; }
  .slot .x:hover { background: var(--lime); color: var(--bg); }
  .link { border: none; background: none; color: var(--green-mid); font: 600 13px var(--body); cursor: pointer; padding: 6px; white-space: nowrap; }
  .add-btn { width: 100%; margin: 14px 0; }
  .pill:disabled { opacity: 0.4; cursor: not-allowed; }
  .presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--text-soft); }
  .presets span { margin-right: 4px; }
  .presets .chip { background: var(--lilac); font-size: 13px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field label { display: block; font-size: 13px; color: var(--text-soft); margin-bottom: 6px; }
  select { width: 100%; font: 500 14px var(--body); padding: 9px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); color: var(--text); }
  .stepper { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid var(--line); border-radius: 12px; padding: 2px; }
  .stepper button { width: 34px; height: 34px; border: none; border-radius: 10px; background: var(--cream); font-size: 18px; cursor: pointer; color: var(--text); }
  .stepper output { font: 600 15px var(--mono); }

  /* ---------- 右侧 ---------- */
  .stats { background: var(--lime); border-radius: var(--radius); padding: 24px 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat b { display: block; font: 700 clamp(36px, 4vw, 52px)/1 var(--display); letter-spacing: -0.05em; }
  .stat b small { font-size: 0.45em; letter-spacing: 0; margin-left: 2px; }
  .stat span { font-size: 13px; color: var(--green-mid); font-weight: 500; }

  .score-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .score-head h2 { font-size: 22px; }
  .tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 100px; background: var(--cream-soft); }
  .tag.lime { background: var(--lime); }
  .tag.lilac { background: var(--lilac); }
  .actions { display: flex; gap: 8px; }
  .play-icon { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--lime); color: var(--bg); font-size: 10px; margin-right: 8px; vertical-align: -5px; }
  #error { display: none; background: #ffe9e4; color: #9b2c16; padding: 12px 16px; border-radius: 14px; margin-bottom: 12px; font-size: 14px; }
  #score { min-height: 200px; overflow-x: auto; }

  /* alphaTab 播放光标：只在播放时显示 */
  #score:not(.playing) .at-cursor-bar, #score:not(.playing) .at-cursor-beat { visibility: hidden; }
  .at-cursor-bar { background: rgba(197, 245, 74, 0.35); }
  .at-cursor-beat { background: var(--green-mid); width: 3px; }
  .at-highlight * { fill: var(--green-mid); stroke: var(--green-mid); }

  /* ---------- 音符明细 ---------- */
  .notes-section { margin-bottom: 48px; }
  .notes-section h2 { font-size: clamp(28px, 3.5vw, 40px); margin-bottom: 20px; }
  .note-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .note { background: var(--white); border-radius: 18px; padding: 16px; }
  .note .pos { font: 500 12px var(--mono); color: var(--text-soft); }
  .note .name { font: 700 34px/1.1 var(--display); letter-spacing: -0.04em; margin: 6px 0 8px; }
  .note .name small { font-size: 0.45em; color: var(--text-soft); letter-spacing: 0; }
  .note .fret { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; }
  .string-dot { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font: 700 13px var(--display); background: var(--bg); color: var(--lime); }
  .role-root { background: var(--lime); }
  .role-third, .role-fourth { background: var(--lilac); }
  .role-fifth { background: var(--cream-soft); }
  .role-seventh { background: var(--lilac-deep); }
  .role-octave { background: var(--lime); }
  .role-chromatic-approach { background: var(--green-mid); color: var(--white); }

  footer { background: var(--bg-deep); color: rgba(243, 239, 229, 0.6); font-size: 13px; padding: 24px 0; }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .hero { grid-template-columns: 1fr; padding: 32px 24px; }
    .hero svg { display: none; }
  }
  @media (max-width: 480px) {
    .wrap { padding: 0 16px; }
    .card { padding: 20px; }
    .stats { padding: 20px; }
    .nav-tag { display: none; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="logo">bassline<span>.</span></div>
    <div class="nav-tag">按乐理规则生成 · 四弦贝斯</div>
  </div>
</nav>

<div class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">Bass practice</div>
      <h1>选一个和弦，<br><em>马上</em>出谱。</h1>
      <p>选根音、和弦和练习方式，按乐理规则生成五线谱和四弦 TAB，可以直接播放跟练。</p>
    </div>
    <!-- 装饰：C 和弦音 C E G 的指板图 = A 弦 3 品、D 弦 2 品、D 弦 5 品
         横线是弦（上 G 下 E，和 TAB 一样）；最左粗线是琴枕，竖线是 1–5 品的品丝，每一格是一品。
         品格中心 x = 60 + 64 × (品 − 0.5)；弦 y：G 50、D 100、A 150、E 200 -->
    <svg viewBox="0 0 400 240" aria-hidden="true">
      <g font-family="JetBrains Mono, monospace" font-size="13" fill="#4d6158" text-anchor="middle">
        <text x="30" y="55">G</text><text x="30" y="105">D</text><text x="30" y="155">A</text><text x="30" y="205">E</text>
        <text x="92" y="234">1</text><text x="156" y="234">2</text><text x="220" y="234">3</text><text x="284" y="234">4</text><text x="348" y="234">5</text>
      </g>
      <g fill="#b8b4f0"><circle cx="220" cy="125" r="6"/><circle cx="348" cy="125" r="6"/></g>
      <g stroke="#b8b4f0" stroke-width="2">
        <line x1="124" y1="40" x2="124" y2="210"/><line x1="188" y1="40" x2="188" y2="210"/>
        <line x1="252" y1="40" x2="252" y2="210"/><line x1="316" y1="40" x2="316" y2="210"/><line x1="380" y1="40" x2="380" y2="210"/>
      </g>
      <line x1="60" y1="40" x2="60" y2="210" stroke="#0d2e23" stroke-width="6"/>
      <g stroke="#0d2e23" stroke-width="2.5" opacity="0.85">
        <line x1="60" y1="50" x2="390" y2="50"/><line x1="60" y1="100" x2="390" y2="100"/>
        <line x1="60" y1="150" x2="390" y2="150"/><line x1="60" y1="200" x2="390" y2="200"/>
      </g>
      <!-- lime 曲线按演奏顺序穿过 A3 → D2 → D5 -->
      <path d="M70 215 C 130 215, 190 185, 220 150 C 245 120, 150 135, 156 100 C 162 62, 300 60, 348 100 C 368 118, 380 110, 392 92"
            fill="none" stroke="#c5f54a" stroke-width="12" stroke-linecap="round"/>
      <g font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="15" text-anchor="middle">
        <circle cx="220" cy="150" r="17" fill="#0d2e23"/><text x="220" y="155" fill="#c5f54a">3</text>
        <circle cx="156" cy="100" r="17" fill="#0d2e23"/><text x="156" y="105" fill="#c5f54a">2</text>
        <circle cx="348" cy="100" r="17" fill="#0d2e23"/><text x="348" y="105" fill="#c5f54a">5</text>
      </g>
    </svg>
  </section>

  <div class="layout">
    <!-- 左：输入 -->
    <div class="card">
      <div class="step">
        <div class="eyebrow">01 · 练习方式</div>
        <div class="segmented" id="types">
          <button class="pill" data-type="chord-tones">和弦音</button>
          <button class="pill" data-type="root-fifth-octave">根音–五度–八度</button>
          <button class="pill" data-type="walking-bass">Walking bass</button>
          <button class="pill" data-type="combined">全部结合</button>
        </div>
      </div>

      <div class="step">
        <div class="eyebrow">02 · 和弦进行</div>
        <div class="progression-box">
          <div class="progression" id="progression"></div>
          <button class="link" id="clearChords">清空</button>
        </div>
        <p class="hint">选根音和类型，再点「加入」。每个和弦一小节。</p>
        <div class="chips" id="roots"></div>
        <div class="chips" id="qualities"></div>
        <button class="pill primary add-btn" id="addChord">+ 加入</button>
        <div class="presets">
          <span>常用进行</span>
          <button class="chip" data-preset="251">ii–V–I</button>
          <button class="chip" data-preset="1625">I–vi–ii–V</button>
          <button class="chip" data-preset="blues">布鲁斯 12 小节</button>
        </div>
      </div>

      <div class="step">
        <div class="eyebrow">03 · 调号和速度</div>
        <div class="field-row">
          <div class="field">
            <label for="key">调号</label>
            <select id="key"><option value="">不加调号</option></select>
          </div>
          <div class="field">
            <label>速度 (BPM)</label>
            <div class="stepper">
              <button id="slower" aria-label="减慢">−</button>
              <output id="tempo">80</output>
              <button id="faster" aria-label="加快">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右：数字 + 乐谱 -->
    <div>
      <div class="stats">
        <div class="stat"><b id="statNotes">–</b><span>个音</span></div>
        <div class="stat"><b id="statBars">–</b><span>小节</span></div>
        <div class="stat"><b id="statTempo">80<small>bpm</small></b><span>速度</span></div>
      </div>

      <div class="card">
        <div id="error"></div>
        <div class="score-head">
          <div>
            <h2 id="title">正在加载 Python…（第一次打开要等几秒）</h2>
            <div class="tags" id="tags"></div>
          </div>
          <div class="actions">
            <button class="pill primary" id="play" disabled><span class="play-icon">▶</span>播放</button>
            <button class="pill" id="stop">停止</button>
          </div>
        </div>
        <div id="score"></div>
      </div>
    </div>
  </div>

  <section class="notes-section">
    <div class="eyebrow">音符明细</div>
    <h2>每个音在<em>哪根弦</em>、第几品。</h2>
    <div class="note-grid" id="notes"></div>
  </section>
</div>

<footer>
  <div class="wrap">bassline · 规则生成的贝斯练习，五线谱和 TAB 由 alphaTab 渲染</div>
</footer>

<script>
const QUALITY_LABELS = {
  "major": "大三", "minor": "小三", "diminished": "减三", "augmented": "增三", "sus4": "挂四",
  "dominant7": "属七", "major7": "大七", "minor7": "小七", "half-diminished7": "半减七", "diminished7": "减七",
};
const QUALITY_SUFFIX = {
  "major": "", "minor": "m", "diminished": "dim", "augmented": "aug", "sus4": "sus4",
  "dominant7": "7", "major7": "maj7", "minor7": "m7", "half-diminished7": "m7b5", "diminished7": "dim7",
};
const ROLE_LABELS = {
  "root": "根音", "third": "三度", "fourth": "四度", "fifth": "五度",
  "seventh": "七度", "octave": "八度", "chromatic-approach": "经过音",
};
const MAX_CHORDS = 16;
const $ = (id) => document.getElementById(id);
const chord = (root, quality) => ({ root, quality });
const symbol = (c) => c.root + QUALITY_SUFFIX[c.quality];

// 常用和弦进行（顺便设好调号）
const PRESETS = {
  "251": { key: "C", chords: [chord("D", "minor7"), chord("G", "dominant7"), chord("C", "major7")] },
  "1625": { key: "C", chords: [chord("C", "major7"), chord("A", "minor7"), chord("D", "minor7"), chord("G", "dominant7")] },
  "blues": { key: "F", chords: ["F", "Bb", "F", "F", "Bb", "Bb", "F", "F", "C", "Bb", "F", "C"].map((r) => chord(r, "dominant7")) },
};

// 页面上所有输入都放在这里。chords 是和弦进行；draft 是正在选、还没加入的和弦
const state = { type: "chord-tones", chords: [chord("C", "major")], draft: chord("C", "major"), key: "", tempo: 80 };

// ---------- alphaTab ----------
const ALPHATAB = "https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist";
const api = new alphaTab.AlphaTabApi($("score"), {
  core: { fontDirectory: ALPHATAB + "/font/", enableLazyLoading: false },  // 乐谱很短，一次全部画完
  display: {
    resources: {
      mainGlyphColor: "#0d2e23", secondaryGlyphColor: "#4d6158",
      staffLineColor: "#b9c4be", barSeparatorColor: "#0d2e23", barNumberColor: "#186b54",
    },
  },
  notation: { elements: { scoreTitle: false, scoreSubTitle: false, guitarTuning: false, trackNames: false, effectDynamics: false } },
  player: { enablePlayer: true, enableCursor: true, soundFont: ALPHATAB + "/soundfont/sonivox.sf2" },
});
api.playerReady.on(() => ($("play").disabled = false));
api.playerStateChanged.on((e) => {
  const playing = e.state === alphaTab.synth.PlayerState.Playing;
  $("score").classList.toggle("playing", playing);
  $("play").innerHTML = `<span class="play-icon">${playing ? "❚❚" : "▶"}</span>${playing ? "暂停" : "播放"}`;
});
$("play").onclick = () => api.playPause();
$("stop").onclick = () => api.stop();

// 同一时间只画一份乐谱：上一份还没画完时来了新的，先记下最新的，画完再画它（中间的旧乐谱直接跳过）。
// 连续快速点击时，alphaTab 同时画两份会出错。
let rendering = false;
let pendingTex = null;
function renderScore(tex) {
  if (rendering) {
    pendingTex = tex;
    return;
  }
  rendering = true;
  api.stop();
  api.tex(tex);
}
function renderDone() {
  rendering = false;
  if (pendingTex !== null) {
    const tex = pendingTex;
    pendingTex = null;
    renderScore(tex);
  }
}
api.postRenderFinished.on(renderDone);
api.error.on(renderDone);

// ---------- 输入控件 ----------
// 一组小圆片：点一个就把 draft 的 field（root 或 quality）改成它
function chipGroup(container, items, field, extraClass = "") {
  container.innerHTML = "";
  for (const { value, label } of items) {
    const chip = document.createElement("button");
    chip.className = `chip ${extraClass}`;
    chip.textContent = label;
    chip.dataset.value = value;
    chip.onclick = () => { state.draft[field] = value; render(); };
    container.append(chip);
  }
}

function markSelected(container, value) {
  for (const el of container.children) el.classList.toggle("on", el.dataset.value === value);
}

function render() {
  for (const btn of $("types").children) btn.classList.toggle("on", btn.dataset.type === state.type);
  markSelected($("roots"), state.draft.root);
  markSelected($("qualities"), state.draft.quality);
  $("addChord").textContent = `+ 加入 ${state.draft.root} ${QUALITY_LABELS[state.draft.quality]}`;
  $("addChord").disabled = state.chords.length >= MAX_CHORDS;
  $("tempo").textContent = state.tempo;
  renderProgression();
}

// 和弦进行：C → A → D → G，每个和弦带一个 × 删除按钮
function renderProgression() {
  const box = $("progression");
  box.innerHTML = state.chords.length ? "" : '<span class="empty">还没有和弦，先在下面选一个加入。</span>';
  state.chords.forEach((c, i) => {
    if (i > 0) box.insertAdjacentHTML("beforeend", '<span class="arrow">→</span>');
    const slot = document.createElement("span");
    slot.className = "slot";
    slot.innerHTML = `${symbol(c)}<button class="x" aria-label="删除 ${symbol(c)}">×</button>`;
    slot.querySelector(".x").onclick = () => { state.chords.splice(i, 1); render(); generate(); };
    box.append(slot);
  });
}

// 组成请求，格式和 Python 的 generate_exercise 参数一样（多一个 tempo）
function buildRequest() {
  const request = { type: state.type, chords: state.chords, tempo: state.tempo };
  if (state.key) request.key = state.key;
  return request;
}

// ---------- 生成 ----------
let latestRequest = 0;  // 连续点击时只用最后一次请求的结果，避免旧结果覆盖新结果

async function generate() {
  const requestId = ++latestRequest;
  if (!state.chords.length) {
    showEmpty("先在左边加入一个和弦");
    return;
  }
  if (["walking-bass", "combined"].includes(state.type) && state.chords.length < 2) {
    showEmpty("walking bass 要从一个和弦走到下一个，再加入至少一个和弦");
    return;
  }
  const data = JSON.parse(python.exercise_json(JSON.stringify(buildRequest())));
  if (requestId !== latestRequest) return;
  $("error").style.display = data.error ? "block" : "none";
  if (data.error) {
    $("error").textContent = data.error.message;
    return;
  }
  $("score").style.visibility = "visible";
  renderScore(data.alphatex);
  showSummary(data.exercise);
  showNotes(data.exercise.notes);
}

function showEmpty(message) {
  api.stop();
  $("error").style.display = "none";
  $("score").style.visibility = "hidden";
  $("title").textContent = message;
  $("tags").innerHTML = "";
  $("notes").innerHTML = "";
  $("statNotes").textContent = $("statBars").textContent = "–";
}

function showSummary(ex) {
  $("title").textContent = ex.description;
  $("statNotes").textContent = ex.notes.length;
  $("statBars").textContent = Math.ceil(ex.total_beats / 4);
  $("statTempo").innerHTML = `${state.tempo}<small>bpm</small>`;
  const uniqueChords = [...new Map(ex.chords.map((c) => [c.symbol, c])).values()];  // 重复的和弦只显示一次
  const keyOption = [...$("key").options].find((o) => o.value === ex.key);
  $("tags").innerHTML =
    uniqueChords.map((c) => `<span class="tag lilac">${c.symbol} · ${c.tones.join(" ")}</span>`).join("") +
    `<span class="tag ${ex.key ? "lime" : ""}">${ex.key ? keyOption.textContent : "不加调号"}</span>`;
}

function showNotes(notes) {
  $("notes").innerHTML = notes.map((n) => `
    <div class="note">
      <div class="pos">小节 ${n.bar} · 拍 ${n.beat}</div>
      <div class="name">${n.name}<small>${n.octave}</small></div>
      <span class="tag role-${n.role}">${ROLE_LABELS[n.role]}${n.interval ? " · " + n.interval : ""}</span>
      <div class="fret"><span class="string-dot">${n.tab.string}</span>${n.tab.string} 弦 ${n.tab.fret} 品</div>
    </div>`).join("");
}

// ---------- 在浏览器里运行 Python（Pyodide） ----------
// bassline 包的文件，和网页放在一起：bassline/xxx.py。包里加了新文件要记得加到这里
const PYTHON_FILES = ["__init__.py", "models.py", "theory.py", "fingering.py", "generator.py", "alphatex.py", "web_api.py"];
let python;  // 加载好后是 { options_json, exercise_json } 两个 Python 函数

async function loadPython() {
  const pyodide = await loadPyodide();
  pyodide.FS.mkdirTree("/home/pyodide/bassline");
  for (const file of PYTHON_FILES) {
    const response = await fetch(`bassline/${file}`);
    if (!response.ok) throw new Error(`读取 bassline/${file} 失败（${response.status}）`);
    pyodide.FS.writeFile(`/home/pyodide/bassline/${file}`, await response.text());
  }
  const webApi = pyodide.pyimport("bassline.web_api");
  return { options_json: webApi.options_json, exercise_json: webApi.exercise_json };
}

// ---------- 启动 ----------
async function init() {
  let options;
  try {
    python = await loadPython();
    options = JSON.parse(python.options_json());
  } catch (e) {
    // 直接双击打开 index.html（file://），或网络加载失败时会走到这里
    $("error").style.display = "block";
    $("error").textContent = location.protocol === "file:"
      ? "不能直接打开 index.html 文件。请在终端运行 python3 web/server.py，然后在浏览器打开 http://localhost:8000。"
      : `加载失败：${e.message}。请检查网络后刷新页面。`;
    $("title").textContent = "";
    return;
  }
  chipGroup($("roots"), options.roots.map((r) => ({ value: r, label: r })), "root", "root");
  chipGroup($("qualities"), options.qualities.map((q) => ({ value: q, label: QUALITY_LABELS[q] ?? q })), "quality");
  for (const k of options.keys) $("key").add(new Option(k.label, k.value));

  for (const btn of $("types").children) btn.onclick = () => { state.type = btn.dataset.type; render(); generate(); };
  $("addChord").onclick = () => { state.chords.push({ ...state.draft }); render(); generate(); };
  $("clearChords").onclick = () => { state.chords = []; render(); generate(); };
  for (const btn of document.querySelectorAll("[data-preset]")) {
    btn.onclick = () => {
      const preset = PRESETS[btn.dataset.preset];
      state.chords = preset.chords.map((c) => ({ ...c }));
      state.key = $("key").value = preset.key;
      render(); generate();
    };
  }
  $("key").onchange = () => { state.key = $("key").value; generate(); };
  $("slower").onclick = () => { state.tempo = Math.max(40, state.tempo - 10); render(); generate(); };
  $("faster").onclick = () => { state.tempo = Math.min(200, state.tempo + 10); render(); generate(); };

  render();
  generate();
}
init();
</script>
